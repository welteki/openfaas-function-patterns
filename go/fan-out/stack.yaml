version: 1.0
provider:
  name: openfaas
  gateway: http://127.0.0.1:8080
functions:
  fan-out:
    lang: golang-middleware
    handler: ./fan-out
    image: ${REGISTRY:-ttl.sh}/${OWNER:-openfaas-examples}/fan-out:latest

  url-check:
    lang: golang-middleware
    handler: ./url-check
    image: ${REGISTRY:-ttl.sh}/${OWNER:-openfaas-examples}/url-check:latest
    environment:
      request_timeout: 5s
